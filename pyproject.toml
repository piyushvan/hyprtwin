[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprtwin"
version = "3.0.0"
description = "A bare-metal, strictly 4GB VRAM-aware local AI OS agent."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "gguf>=0.9.0"
]

[project.scripts]
twin = "hyprtwin.cli:app"
